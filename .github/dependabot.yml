# Avisos automáticos de actualizaciones de dependencias.
# Solo propone versiones menores y parches (los saltos grandes como Tailwind 4 o TypeScript 7
# pueden romper el sitio y se hacen a mano).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      menores:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
