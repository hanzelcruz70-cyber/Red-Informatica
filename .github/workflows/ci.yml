name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security secrets (gitleaks)
        run: |
          curl -sSL --fail --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gl.tgz
          # Checksum oficial de la release v8.24.3 (gitleaks_8.24.3_checksums.txt):
          # si el archivo fue alterado o la descarga falló, el CI se detiene aquí
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gl.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/gl.tgz gitleaks
          /tmp/gitleaks detect --redact --no-banner --verbose
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SITE_URL: https://red-informatica.com
      - name: Security deps
        run: npm audit --omit=dev --audit-level=critical
